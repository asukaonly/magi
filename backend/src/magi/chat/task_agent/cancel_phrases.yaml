# Exact normalized phrases accepted by the text cancel fallback.
# Typed cancel commands remain the primary protocol. Substring matching is
# intentionally forbidden so ordinary task text reaches the active run.

en:
  - stop
  - cancel
  - abort
  - nevermind
  - halt
  - quit
  - stopit
  - stopnow
  - cancelit
  - cancelthat
  - abortit
  - dontdothat
  - donotdothat

