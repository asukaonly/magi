# Magi Agent Configuration
#
# This is the example configuration file.
# On first run, it will be copied to ~/.magi/config/agent.yaml.
#
# Runtime LLM provider and model selection now come from the persisted config
# below instead of LLM_* environment variables.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  providers:
    openai:
      enabled: false
      provider_type: openai
      display_name: OpenAI
      api_key: ""
      base_url: ""
      api_format: null
      custom_models: []
      custom_default_model: null
  selections:
    context_decider:
      provider_id: ""
      model: ""
      capability_override_enabled: false
      capabilities:
        vision: false
        image_output: false
        tool_calling: true
        reasoning: true
        embedding: false
      limits:
        context_window: null
        max_output_tokens: null
      provider_options: {}
    core:
      provider_id: ""
      model: ""
      capability_override_enabled: false
      capabilities:
        vision: false
        image_output: false
        tool_calling: true
        reasoning: true
        embedding: false
      limits:
        context_window: null
        max_output_tokens: null
      provider_options: {}
    embedding:
      provider_id: ""
      model: ""
      capability_override_enabled: false
      capabilities:
        vision: false
        image_output: false
        tool_calling: false
        reasoning: false
        embedding: true
      limits:
        context_window: null
        max_output_tokens: null
      provider_options: {}
  temperature: 0.7
  max_tokens: 4096
  timeout: 60

# =============================================================================
# Agent Configuration
# =============================================================================
agent:
  name: "magi-agent"
  num_task_agents: 2
  loop_interval: 1.0
  enable_monitoring: true

  memory:
    db_path: "~/.magi/data/memories"
    retention_days: 7
    enable_l0: true
    enable_l1: true
    enable_l2: true
    enable_l3: true
    enable_l4: true
    l0_checkpoint_interval_seconds: 30
    runtime_replay_include_l0_only: false
    enable_t1_importance: true
    enable_l2_llm_extraction: true
    enable_l3_llm_summary: true
    enable_l4_skill_extraction: true
    enable_l1_raw: true
    enable_l2_relations: true
    enable_l3_embeddings: true
    enable_l4_summaries: true
    enable_l5_capabilities: true
    async_embeddings: true
    auto_extract_relations: true
    summary_interval_minutes: 60

    # Embedding model is configured via LLM EMBEDDING scenario (see llm.selections.embedding)
    embedding:
      backend: "sqlite_vec"

  personality:
    name: "default"
    path: "~/.magi/personalities"
    enable_evolution: true

  message_bus:
    backend: "sqlite"
    max_queue_size: 1000
    num_workers: 4
    db_path: "~/.magi/data/message_queue.db"

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  reload: true
  debug: false
  desktop_session_token: ""
  cors_origins: ["*"]

# =============================================================================
# Feature Flags
# =============================================================================
features:
  enable_three_layer_arch: false
  enable_skills: true
  enable_websocket: true

# =============================================================================
# Tools Configuration
# =============================================================================
tools:
  weather:
    enabled: true
    default_provider: "qweather"
    providers:
      qweather:
        api_key: ""
        base_url: ""

  web_search:
    enabled: true
    default_provider: "duckduckgo"
    providers:
      duckduckgo:
        base_url: ""
      brave:
        api_key: ""
      perplexity:
        api_key: ""
      tavily:
        api_key: ""

  web_fetch:
    enabled: true
    default_provider: "http"
    providers:
      http:
        base_url: ""
      browser:
        base_url: ""
      curl:
        base_url: ""

# =============================================================================
# Plugins
# =============================================================================
plugins:
  scan_paths:
    - "plugins"
    - "~/.magi/plugins"
  packages:
    core-tools:
      enabled: true
      trusted: true
      source: "builtin"
      settings: {}
    core-timeline:
      enabled: true
      trusted: true
      source: "builtin"
      settings:
        sensors:
          chat:
            enabled: true
            sync_mode: "watch"
            sync_interval_minutes: 1
            default_retention_mode: "analyze_only"
            storage_mode: "managed"
            edge_whitelist: ["MENTIONED", "CARES_ABOUT", "LIKES", "DISLIKES", "INTERACTED_WITH"]
          manual_journal:
            enabled: true
            sync_mode: "manual"
            sync_interval_minutes: 1
            default_retention_mode: "retain_raw"
            storage_mode: "managed"
            edge_whitelist: ["MENTIONED", "CARES_ABOUT", "LIKES", "DISLIKES", "CREATED", "RELATED_TO"]
          browser_history:
            enabled: true
            sync_mode: "interval"
            sync_interval_minutes: 30
            default_retention_mode: "analyze_only"
            storage_mode: "managed"
            source_path: ""
            fetch_page_content: false
            edge_whitelist: ["VIEWED", "VISITED", "CARES_ABOUT", "LIKES"]
          photo_library:
            enabled: true
            sync_mode: "interval"
            sync_interval_minutes: 60
            default_retention_mode: "retain_raw"
            storage_mode: "external_reference"
            source_path: ""
            edge_whitelist: ["CAPTURED", "RELATED_TO", "INTERACTED_WITH", "CREATED"]
    core-actions:
      enabled: true
      trusted: true
      source: "builtin"
      settings:
        notifications:
          default_level: "info"
        email:
          default_sender: ""
          provider_mode: "simulated"

# =============================================================================
# Global Settings
# =============================================================================
debug: false
log_level: "INFO"
