custom_provider:
  enabled: true
  display_name: Custom Provider
  description: Connect OpenAI-compatible or Anthropic-compatible endpoints
  icon: custom
  capabilities:
    vision: false
    image_output: false
    tool_calling: true
    reasoning: true
    embedding: false
  provider_options_example: {}
  fields:
    custom_name:
      visible: true
      required: true
      placeholder: My Provider
    api_format:
      visible: true
      required: true
      options:
        - openai
        - anthropic
    model:
      visible: true
      required: true
    api_key:
      visible: true
      required: true
    base_url:
      visible: true
      required: false
