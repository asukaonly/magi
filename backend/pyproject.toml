[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magi"
version = "0.1.29"
description = "Local-first AI agent with personality, memory, and temporal awareness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Magi Contributors" }]
keywords = ["ai", "agent", "llm", "memory", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core framework
    #
    # Keep FastAPI and Pydantic within the compatibility window exercised by
    # the transport contract tests. Intentional upgrades must validate the
    # exported Python route schema and the affected frontend API modules.
    "fastapi>=0.136.0,<0.138.0",
    # Pinned explicitly because fastapi declares no upper bound and pip
    # does not eagerly upgrade transitives; PYSEC-2026-161 is fixed in 1.0.1.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.13.0,<2.14.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.27",
    # Pinned transitively for CVE-2026-45409 (idna domain length DoS);
    # required >=3.15 for the fix.
    "idna>=3.15",

    # Identifiers
    "python-ulid>=2.2.0",

    # Dependency injection
    "dependency-injector>=4.41.0",

    # Configuration
    "pyyaml>=6.0.1",
    "tomli>=1.1.0; python_version < '3.11'",
    "tomli-w>=1.0",

    # Logging
    "structlog>=24.1.0",

    # Database
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",

    # Vector database
    "sqlite-vec>=0.1.6",

    # Full-text search tokenizer
    "jieba>=0.42.1",

    # LLM SDK
    "openai>=1.10.0",
    "anthropic>=0.18.0",

    # WebSocket
    "python-socketio>=5.11.0",
    "aiohttp>=3.13.4",

    # Authentication
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # Natural language date parsing
    "dateparser>=1.2.0",

    # Utilities
    "packaging>=23.0",
    "tzlocal>=5.0",
    "httpx>=0.26.0",
    "socksio>=1.0.0",
    "aiofiles>=23.2.1",
    "playwright>=1.53.0",
    "pypdf>=5.0.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.18.0",

    # Local embedding / reranker (ONNX)
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.20.0",

    # Plugin SDK (shared contracts; install sdk/ in editable mode for local dev)
    "magi-plugin-sdk>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8.0",
    "black>=24.1.0",
    "ruff==0.16.0",
    "mypy>=1.8.0",
    "import-linter>=2.11",
]

[project.urls]
Repository = "https://github.com/asukaonly/magi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"magi.i18n" = ["locales/*.json"]
"magi.agent.task_agents.chat" = ["*.yaml"]
"magi.db.migrations.chat" = ["script.py.mako"]
"magi.db.migrations.l1" = ["script.py.mako"]
"magi.db.migrations.memory_shared" = ["script.py.mako"]
"magi.db.migrations.runtime_trace" = ["script.py.mako"]
"magi.db.migrations.llm_usage" = ["script.py.mako"]
"magi.db.migrations.persona_registry" = ["script.py.mako"]
"magi.db.migrations.behavior_evolution" = ["script.py.mako"]
"magi.db.migrations.emotional" = ["script.py.mako"]
"magi.db.migrations.growth_memory" = ["script.py.mako"]
"magi.db.migrations.scheduler" = ["script.py.mako"]
"magi.db.migrations.sensor_state" = ["script.py.mako"]
"magi.db.migrations.background_tasks" = ["script.py.mako"]
"magi.db.migrations.message_queue" = ["script.py.mako"]
"magi.db.migrations.permission_rules" = ["script.py.mako"]
"magi.db.migrations.channels" = ["script.py.mako"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
