# Strict cancel phrases used by the chat-task-agent interruption fast path.
#
# Each entry is the canonical normalized form: lowercase, with all
# punctuation/whitespace stripped (see InterruptionClassifier._strict_normalize).
# Only entries that match the *full* normalized message trigger an
# immediate INTERRUPT; substring matches are intentionally NOT performed
# here because messages that merely mention a cancel keyword in passing
# ("don't stop at the login page", "把这个取消订阅按钮改一下") must fall
# through to the LLM classifier.
#
# When QA / language reviewers add a phrase, follow the same rule:
# normalize it manually (lowercase + strip punctuation) before pasting in.

en:
  # Single-word cancels
  - stop
  - cancel
  - abort
  - nevermind
  - nope
  - halt
  - quit
  # Multi-word cancels (after punctuation/whitespace strip)
  - stopit
  - stopnow
  - cancelit
  - cancelthat
  - abortit
  - dontdothat
  - donotdothat

zh:
  # Short Chinese cancels — already normalized (CJK has no whitespace
  # to strip and the regex preserves CJK characters).
  - 不用做了
  - 不用了
  - 先停
  - 先停一下
  - 停一下
  - 停下
  - 停止
  - 取消
  - 别做了
  - 算了
  - 算了吧
  - 搞错了
  - 不做了
