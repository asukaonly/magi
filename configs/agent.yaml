# Magi Agent Framework - Configuration File
#
# Environment Variables (set in .env):
#   LLM_PROVIDER     - openai | anthropic | glm | local
#   LLM_MODEL        - Model name (e.g., gpt-4o-mini)
#   LLM_API_KEY      - API key
#   LLM_BASE_URL     - Custom API endpoint
#   LLM_TEMPERATURE  - Sampling temperature (0.0-2.0)
#   LLM_MAX_TOKENS   - Maximum tokens
#   LLM_TIMEOUT      - Request timeout (seconds)
#
#   WEATHER_API_KEY      - Weather tool API key
#   WEATHER_DEFAULT_LOCATION - Default location
#   SEARCH_API_KEY       - Web search API key
#   SEARCH_ENGINE        - google | bing | duckduckgo

agent:
  name: "magi-agent"

  # LLM Configuration
  llm:
    provider: "${LLM_PROVIDER:openai}"
    model: "${LLM_MODEL:gpt-4o-mini}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL:}"
    temperature: 0.7
    max_tokens: 1000
    timeout: 60

  # Memory Configuration
  memory:
    short_term_backend: "memory"
    long_term_backend: "chromadb"
    db_path: "~/.magi/data/memories"
    chromadb_path: "~/.magi/data/chromadb"
    retention_days: 7

    # L1-L5 Memory Layers
    enable_l1_raw: true
    enable_l2_relations: true
    enable_l3_embeddings: true
    enable_l4_summaries: true
    enable_l5_capabilities: true

    # Embedding settings
    embedding:
      backend: "local"
      local_model: "all-MiniLM-L6-v2"
      local_dimension: 384

  # Personality Configuration
  personality:
    name: "default"
    path: "~/.magi/personalities"
    enable_evolution: true
    db_path: "~/.magi/data/memories/self_memory_v2.db"

  # Message Bus Configuration
  message_bus:
    backend: "sqlite"
    max_queue_size: 1000
    drop_policy: "lowest_priority"
    num_workers: 4
    sqlite_db_path: "~/.magi/data/magi_events.db"

  # Task Agent Configuration
  num_task_agents: 2
  loop_interval: 1.0
  enable_monitoring: true

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["*"]

# Feature Flags
features:
  enable_three_layer_arch: false
  enable_skills: true
  enable_websocket: true

# Tools Configuration
tools:
  weather:
    enabled: true
    api_key: "${WEATHER_API_KEY:}"
    base_url: "${WEATHER_BASE_URL:}"
    default_location: "${WEATHER_DEFAULT_LOCATION:Beijing}"

  web_search:
    enabled: true
    api_key: "${SEARCH_API_KEY:}"
    engine: "${SEARCH_ENGINE:google}"
    max_results: 5

# Global Configuration
debug: false
log_level: "INFO"
