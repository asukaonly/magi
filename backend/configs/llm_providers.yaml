providers:
  - id: openai
    display_name: OpenAI
    description: 通用能力强，生态最完善
    icon: sparkles
    default_model: gpt-4o-mini
    default_base_url: https://api.openai.com/v1
    model_options:
      - gpt-4o-mini
      - gpt-4.1
      - o3
    fields:
      model:
        visible: false
        required: false
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false
  - id: anthropic
    display_name: Anthropic
    description: 长文本与复杂推理表现稳定
    icon: brain
    default_model: claude-3-5-sonnet
    default_base_url: https://api.anthropic.com/v1
    model_options:
      - claude-3-5-sonnet
      - claude-3-7-sonnet
      - claude-opus-4-1
    fields:
      model:
        visible: false
        required: false
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false
  - id: glm
    display_name: GLM
    description: 本地中文场景体验更友好
    icon: zap
    default_model: glm-4.5
    default_base_url: https://open.bigmodel.cn/api/paas/v4
    model_options:
      - glm-4.5
      - glm-4.5-air
      - glm-4.5-flash
    fields:
      model:
        visible: false
        required: false
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false
custom_provider:
  enabled: true
  display_name: 自定义 Provider
  description: 接入兼容 OpenAI/Anthropic 或自定义格式的服务
  icon: wand
  fields:
    custom_name:
      visible: true
      required: true
      placeholder: My Provider
    api_format:
      visible: true
      required: true
      options:
        - openai
        - anthropic
        - custom
    model:
      visible: true
      required: true
    api_key:
      visible: true
      required: true
    base_url:
      visible: true
      required: false
