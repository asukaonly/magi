providers:
  - id: openai
    display_name: OpenAI
    description: General purpose, strongest ecosystem
    icon: openai
    default_model: gpt-5.2
    default_classify_model: gpt-5.2
    default_base_url: https://api.openai.com/v1
    chat_models:
      - id: gpt-5
        label: GPT-5
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 400000
          max_output_tokens: 128000
          max_concurrency: 3
      - id: gpt-5.2
        label: GPT-5.2
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 400000
          max_output_tokens: 128000
          max_concurrency: 2
      - id: o3
        label: o3
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 200000
          max_output_tokens: 100000
          max_concurrency: 2
    embedding_models:
      - id: text-embedding-3-small
        label: Text Embedding 3 Small
        dimensions: [1536, 512]
        limits:
          max_concurrency: 6
      - id: text-embedding-3-large
        label: Text Embedding 3 Large
        dimensions: [3072, 1024, 256]
        limits:
          max_concurrency: 4
    image_generation_models: []
    audio_generation_models:
      - id: gpt-4o-mini-tts
        label: GPT-4o Mini TTS
    fields:
      model:
        visible: true
        required: true
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false

