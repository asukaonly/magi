[package]
name = "magi-server-runtime"
version = "0.1.0"
description = "Independent Magi service lifecycle"
edition = "2021"

[dependencies]
magi-service-contract = { path = "../magi-service-contract" }
magi-gateway = { path = "../magi-gateway" }
magi-platform = { path = "../magi-platform" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading",
] }
