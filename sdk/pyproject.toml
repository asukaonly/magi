[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-plugin-sdk"
version = "0.2.0"
description = "SDK for building Magi plugins — provides plugin contracts with minimal dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Magi Contributors" }]
keywords = ["magi", "plugin", "sdk", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = ["pydantic>=2.5.0"]

[project.urls]
Homepage = "https://github.com/asukaonly/magi"
Repository = "https://github.com/asukaonly/magi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magi_plugin_sdk = ["py.typed"]
