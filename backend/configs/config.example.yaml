# Magi Agent Configuration
#
# This is the example configuration file.
# On first run, it will be copied to ~/.magi/config/agent.yaml
#
# Environment variables can be used with ${VAR_NAME:default} syntax
# They will override values in this file

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "${LLM_PROVIDER:openai}"
  model: "${LLM_MODEL:gpt-4o-mini}"
  api_key: "${LLM_API_KEY:}"
  base_url: "${LLM_BASE_URL:}"
  temperature: 0.7
  max_tokens: 4096
  timeout: 60
  capability_override_enabled: false
  capabilities:
    vision: false
    image_output: false
    tool_calling: true
    reasoning: true
    embedding: false
  limits:
    context_window: null
    max_output_tokens: null
  provider_options: {}

# =============================================================================
# Agent Configuration
# =============================================================================
agent:
  name: "magi-agent"
  num_task_agents: 2
  loop_interval: 1.0
  enable_monitoring: true

  # Memory Configuration
  memory:
    db_path: "~/.magi/data/memories"
    retention_days: 7

    # L1-L5 Memory Layers
    enable_l1_raw: true
    enable_l2_relations: true
    enable_l3_embeddings: true
    enable_l4_summaries: true
    enable_l5_capabilities: true
    async_embeddings: true
    auto_extract_relations: true
    summary_interval_minutes: 60

    # Embedding settings
    embedding:
      backend: "sqlite_vec"
      local_model: "all-MiniLM-L6-v2"
      local_dimension: 384

  # Personality Configuration
  personality:
    name: "default"
    path: "~/.magi/personalities"
    enable_evolution: true

  # Message Bus Configuration
  message_bus:
    backend: "sqlite"
    max_queue_size: 1000
    num_workers: 4
    db_path: "~/.magi/data/events.db"

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["*"]

# =============================================================================
# Feature Flags
# =============================================================================
features:
  enable_three_layer_arch: false
  enable_skills: true
  enable_websocket: true

# =============================================================================
# Tools Configuration
# =============================================================================
tools:
  weather:
    enabled: true
    default_provider: "qweather"  # Default provider to use
    providers:
      qweather:
        api_key: ""  # Set your QWeather API key here
        base_url: ""  # Optional: API host (default: devapi.qweather.com)

  web_search:
    enabled: true
    default_provider: "duckduckgo"  # Default provider: duckduckgo, brave, perplexity, or tavily
    providers:
      duckduckgo:
        base_url: ""  # Optional: HTML endpoint override
      brave:
        api_key: ""  # Set your Brave Search API key here
      perplexity:
        api_key: ""  # Set your Perplexity API key here
      tavily:
        api_key: ""  # Set your Tavily API key here

  web_fetch:
    enabled: true
    default_provider: "http"  # Default provider for non-auto mode
    providers:
      http:
        base_url: ""  # Reserved for custom endpoint
      browser:
        base_url: ""  # Reserved for remote browser endpoint
      curl:
        base_url: ""  # Reserved for extension

# =============================================================================
# Plugins
# =============================================================================
plugins:
  scan_paths:
    - "plugins"
    - "~/.magi/plugins"
  packages:
    core-tools:
      enabled: true
      trusted: true
      source: "builtin"
      settings: {}
    core-timeline:
      enabled: true
      trusted: true
      source: "builtin"
      settings:
        sensors:
          chat:
            enabled: true
            sync_mode: "watch"
            sync_interval_minutes: 1
            default_retention_mode: "analyze_only"
            storage_mode: "managed"
            edge_whitelist: ["MENTIONED", "CARES_ABOUT", "LIKES", "DISLIKES", "INTERACTED_WITH"]
          manual_journal:
            enabled: true
            sync_mode: "manual"
            sync_interval_minutes: 1
            default_retention_mode: "retain_raw"
            storage_mode: "managed"
            edge_whitelist: ["MENTIONED", "CARES_ABOUT", "LIKES", "DISLIKES", "CREATED", "RELATED_TO"]
          browser_history:
            enabled: true
            sync_mode: "interval"
            sync_interval_minutes: 30
            default_retention_mode: "analyze_only"
            storage_mode: "managed"
            source_path: ""
            fetch_page_content: false
            edge_whitelist: ["VIEWED", "VISITED", "CARES_ABOUT", "LIKES"]
          photo_library:
            enabled: true
            sync_mode: "interval"
            sync_interval_minutes: 60
            default_retention_mode: "retain_raw"
            storage_mode: "external_reference"
            source_path: ""
            edge_whitelist: ["CAPTURED", "RELATED_TO", "INTERACTED_WITH", "CREATED"]
    core-actions:
      enabled: true
      trusted: true
      source: "builtin"
      settings:
        notifications:
          default_level: "info"
        email:
          default_sender: ""
          provider_mode: "simulated"

# =============================================================================
# Global Settings
# =============================================================================
debug: false
log_level: "INFO"
