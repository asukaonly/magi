# Preset local embedding models for ONNX Runtime inference.
#
# Each entry defines a model that can be downloaded and used locally.
# Models are stored under ~/.magi/cache/models/embed/{id}/
#
# `variants` enumerates the per-quantization ONNX files available in the upstream
# HuggingFace repo. `default_variant` maps a platform key (sys.platform + "_" +
# platform.machine().lower()) to the variant the runtime picks when the user has
# not set an explicit override. `_fallback` is used if no platform-specific entry
# matches.
#
# Required sidecar files: tokenizer.json + config.json. (Some models also need
# tokenizer_config.json, special_tokens_map.json, vocab.txt, sentencepiece.bpe.model
# — the loader always pulls all of these when present.)

models:
  - id: bge-small-zh-v1.5
    label: "BGE Small Chinese v1.5"
    repo: "BAAI/bge-small-zh-v1.5"
    onnx_repo: "onnx-community/bge-small-zh-v1.5-ONNX"
    dimension: 512
    max_tokens: 512
    pooling: cls
    normalize: true
    size_mb: 24            # legacy/summary: size of default variant on x86 (quantized)
    size_fp32_mb: 96
    quantized: true        # legacy/summary: true iff default variant != fp32
    languages: [zh, en]
    recommended: true
    description: "Lightweight Chinese-English model, recommended for personal use"
    variants:
      fp32:      { file: "onnx/model.onnx",            size_mb: 96 }
      fp16:      { file: "onnx/model_fp16.onnx",       size_mb: 48 }
      quantized: { file: "onnx/model_quantized.onnx",  size_mb: 24 }
      int8:      { file: "onnx/model_int8.onnx",       size_mb: 24 }
    default_variant:
      darwin_arm64:  fp16
      win32_amd64:   quantized
      linux_x86_64:  quantized
      _fallback:     quantized

  - id: snowflake-arctic-embed-m-v2.0
    label: "Snowflake Arctic Embed M v2.0"
    repo: "Snowflake/snowflake-arctic-embed-m-v2.0"
    onnx_repo: "Snowflake/snowflake-arctic-embed-m-v2.0"
    dimension: 768
    max_tokens: 8192
    pooling: cls
    normalize: true
    size_mb: 311
    size_fp32_mb: 1230
    quantized: true
    languages: [multi]
    recommended: true
    description: "High-quality multilingual model (74 languages, 768d), Dec 2024, Apache 2.0"
    variants:
      fp32:      { file: "onnx/model.onnx",            size_mb: 1230 }
      fp16:      { file: "onnx/model_fp16.onnx",       size_mb: 615 }
      quantized: { file: "onnx/model_quantized.onnx",  size_mb: 311 }
      int8:      { file: "onnx/model_int8.onnx",       size_mb: 311 }
    default_variant:
      darwin_arm64:  fp16
      win32_amd64:   quantized
      linux_x86_64:  quantized
      _fallback:     quantized

  - id: qwen3-embedding-0.6b
    label: "Qwen3 Embedding 0.6B"
    repo: "Qwen/Qwen3-Embedding-0.6B"
    onnx_repo: "onnx-community/Qwen3-Embedding-0.6B-ONNX"
    dimension: 1024
    max_tokens: 8192
    pooling: last_token
    normalize: true
    size_mb: 585
    size_fp32_mb: 2300
    quantized: true
    languages: [multi]
    recommended: true
    description: "Qwen3 decoder-only embedding (100+ languages, 1024d), Jun 2025, Apache 2.0"
    variants:
      fp32:      { file: "onnx/model.onnx",            size_mb: 2300, ext_data: true }
      fp16:      { file: "onnx/model_fp16.onnx",       size_mb: 1150 }
      quantized: { file: "onnx/model_quantized.onnx",  size_mb: 585 }
      int8:      { file: "onnx/model_int8.onnx",       size_mb: 585 }
    default_variant:
      darwin_arm64:  fp16
      win32_amd64:   quantized
      linux_x86_64:  quantized
      _fallback:     quantized

  - id: bge-small-en-v1.5
    label: "BGE Small English v1.5"
    repo: "BAAI/bge-small-en-v1.5"
    onnx_repo: "onnx-community/bge-small-en-v1.5-ONNX"
    dimension: 384
    max_tokens: 512
    pooling: cls
    normalize: true
    size_mb: 33
    size_fp32_mb: 134
    quantized: true
    languages: [en]
    recommended: false
    description: "Lightweight English embedding model"
    variants:
      fp32:      { file: "onnx/model.onnx",            size_mb: 134 }
      fp16:      { file: "onnx/model_fp16.onnx",       size_mb: 67 }
      quantized: { file: "onnx/model_quantized.onnx",  size_mb: 33 }
      int8:      { file: "onnx/model_int8.onnx",       size_mb: 33 }
    default_variant:
      darwin_arm64:  fp16
      win32_amd64:   quantized
      linux_x86_64:  quantized
      _fallback:     quantized
