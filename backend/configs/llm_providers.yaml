providers:
  - id: openai
    display_name: OpenAI
    description: General purpose, strongest ecosystem
    icon: openai
    default_model: gpt-5.2
    default_base_url: https://api.openai.com/v1
    models:
      - id: gpt-5
        label: GPT-5
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
          embedding: false
        limits:
          context_window: 400000
          max_output_tokens: 128000
      - id: gpt-5.2
