name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly canonical full run (single-process backstop) at 02:00 CST / 18:00 UTC.
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend import boundaries
        working-directory: frontend
        run: npm run check:boundaries

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e ".[dev]"

      - name: Run backend smoke validation
        run: ./scripts/run-backend-smoke.sh

      - name: Run backend type gate
        run: ./scripts/run-backend-type-gate.sh

      - name: Lint backend
        working-directory: backend
        run: python -m ruff check src/magi

      - name: Run backend test suite
        working-directory: backend
        timeout-minutes: 15
        # PR + push to main: run the full suite in parallel (pytest-xdist) for
        # fast full-coverage feedback. Nightly (schedule): canonical single-process
        # run as a backstop in case parallelism ever masks an ordering-dependent
        # failure. Coverage is identical across both; only the runner differs.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m pytest -q
          else
            python -m pytest -n auto -q
          fi

      - name: Check import layer contracts
        working-directory: backend
        run: lint-imports

      - name: Check gateway API contract
        run: python scripts/check-api-contract.py

      - name: Check SQLite ownership contract
        run: python scripts/check-sqlite-ownership.py

      - name: Export Python OpenAPI contract
        run: python scripts/export-python-openapi.py --output /tmp/magi-python-openapi.json

  gateway:
    name: Gateway validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run gateway tests
        run: cargo test -p magi-gateway

  api-types-drift:
    name: Generated API types in sync with backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Install backend (for FastAPI OpenAPI export)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate API types
        run: bash scripts/gen-api-types.sh

      - name: Assert generated.ts is committed up to date
        run: |
          if ! git diff --exit-code -- frontend/src/types/api/generated.ts; then
            echo "::error::frontend/src/types/api/generated.ts is stale."
            echo "Run 'bash scripts/gen-api-types.sh' locally and commit the result."
            exit 1
          fi
