# Magi data lifecycle defaults.
#
# This file is copied to ~/.magi/config/lifecycle.yaml on first run.
# It centralizes operational cleanup windows so early releases can tune
# local data governance without changing code.

lifecycle:
  runtime_trace:
    raw_retention_days: 7
    notifications_retention_days: 7
    plugin_ingress_retention_days: 7

  llm_usage:
    raw_retention_days: 7
    rollup_retention_days: 180
    rollup_granularity: day
    cache_observability:
      enabled: true
      retention_days: 30
      max_rows: 50000
      store_tool_names: true

  message_queue:
    completed:
      raw_retention_hours: 24
      rollup_retention_days: 30
      rollup_granularity: hour
    failed:
      raw_retention_days: 7

  scheduler:
    executions:
      success_retention_days: 30
      failed_retention_days: 60
    source_sync_jobs:
      success_retention_days: 30
      failed_retention_days: 60

  source_state:
    fingerprints_keep_latest: 10000

  chat_assets:
    delete_on_session_delete: true
    orphan_grace_hours: 24

  ephemeral_jobs:
    personality_generation_ttl_seconds: 1800
