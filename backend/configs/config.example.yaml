# Magi Agent Configuration
#
# This is the example configuration file.
# On first run, it will be copied to ~/.magi/config/agent.yaml.
#
# LLM defaults are generated from backend/configs/llm_providers.yaml.
# Runtime overrides are persisted to ~/.magi/config/llm.yaml.

# =============================================================================
# Agent Configuration
# =============================================================================
agent:
  name: "magi-agent"
  num_task_agents: 2
  loop_interval: 1.0
  enable_monitoring: true

  memory:
    db_path: "~/.magi/data/memory"
    retention_days: 90
    history_behavior: "delete" # "delete" or "archive"
    archive_path: "~/.magi/data/memory/archive"
    embedding:
      mode: "remote" # "remote" or "local"
      local:
        model_source: "managed" # "managed" or "external"
        managed_model_id: null
        model_dir_path: null
        idle_timeout_seconds: 1800
    reranker:
      layers: ["L1", "L3"]
      top_k: 8
      candidate_max_chars: 500
      cross_encoder:
        enabled: false
        model_source: "managed"
        managed_model_id: null

    query_expansion:
      enabled: true
      max_expansions: 2
      timeout_seconds: 3.0

    graph_spreading:
      enabled: true
      max_hops: 2
      max_neighbors: 10
      max_entities: 50
      decay: 0.5
      rrf_weight: 0.6

    retrieval_enhancement:
      unified_reranking_enabled: false
      confidence_fallback_enabled: false
      confidence_fallback_min_score: 0.3
      confidence_fallback_top_k: 5

    entity_semantic_edges:
      enabled: false
      similarity_threshold: 0.75
      max_sibling_events: 20
      max_edges_per_event: 10

    l0:
      enabled: true
      checkpoint_interval_seconds: 30
      attention_update_turn_threshold: 3
      attention_update_idle_seconds: 30
      attention_update_max_delay_seconds: 90

    l1:
      enabled: true
      retention_days: 30
      vectors_enabled: true

    l2:
      enabled: true
      batch_flush_interval_seconds: 60
      auto_extract_relations: true
      # Background catalog/graph cleanup (runtime worker only). Skipped when L2 is disabled.
      maintenance_enabled: true
      maintenance_interval_seconds: 86400
      # Background episode/experience consolidation (runtime worker only). Skipped when L2 is disabled.
      consolidation_enabled: true
      consolidation_interval_seconds: 86400
      maintenance_min_mentions: 2
      # Lifecycle thresholds for L2 maintenance (decay / archival / reconciliation).
      # Defaults preserve prior behavior; tune only if you understand the impact.
      lifecycle:
        fast_decay_ttl_seconds: 14400 # 4h: annoyance/irritation assertions
        session_decay_ttl_seconds: 86400 # 24h: mood/engagement assertions
        archive_confidence_threshold: 0.3
        archive_staleness_seconds: 7776000 # 90 days
        archive_single_observation_staleness_seconds: 15552000 # 180 days
        purge_terminal_edge_staleness_seconds: 31536000 # 365 days
        reconcile_stale_threshold_seconds: 3600 # 1h
        reconcile_batch_size: 100
        reconcile_max_total: 500
        promotion_counter_retention_seconds: 2592000 # 30 days
      # Retention/capacity caps for L2 cognition artifacts.
      limits:
        snapshot_history_limit: 5 # entries per snapshot history field
        mood_trajectory_limit: 20 # entries in a snapshot mood/stress/engagement trajectory
        max_evidence_event_ids: 50 # evidence event IDs retained per edge/assertion/facet merge
      # Confidence policy for L2 extraction and evidence accumulation.
      confidence:
        accumulation_cap: 0.99 # noisy-OR ceiling for accumulated edge/facet evidence
        single_event_cap: 0.3 # confidence ceiling for single-event extraction batches
      # Episode formation, promotion, merge, and standout-gate thresholds.
      episode:
        min_events_to_promote: 3
        min_age_to_promote_seconds: 1800 # 30 min
        merge_gap_factor: 1.5
        min_entity_overlap_for_merge: 0.3
        standout_min_events: 8
        standout_min_duration_seconds: 2700 # 45 min
        standout_dense_event_count: 20
        standout_min_distinct_entities: 2
      # Experience promotion gates: quality score, dedup, repeated-goal seeds.
      experience:
        min_quality_score: 6
        duplicate_overlap_ratio: 0.8
        min_repeated_goal_episodes: 3
        min_repeated_goal_events: 8
        max_repeated_goal_window_seconds: 2592000 # 30 days
        max_repeated_goal_gap_seconds: 604800 # 7 days
      # Assertion confidence curve, graduation gates, and state-family decay TTLs.
      assertion:
        confidence_base: 0.3
        confidence_slope: 0.25
        confidence_ceiling: 0.95
        stable_evidence_count: 3
        stable_time_span_hours: 24.0
        corroborated_evidence_count: 2
        user_rejected_confidence: 0.10
        user_confirmed_confidence_floor: 0.85
        expired_confidence_ceiling: 0.30
        contradicted_confidence_ceiling: 0.35
        stable_confidence_floor: 0.82
        temporary_corroborated_confidence_floor: 0.50
        corroborated_confidence_floor: 0.58
        tentative_confidence_ceiling: 0.30
        momentary_ttl_seconds: 7200 # 2h
        mood_ttl_seconds: 43200 # 12h
        stress_ttl_seconds: 86400 # 24h
        engagement_ttl_seconds: 43200 # 12h
        group_sentiment_ttl_seconds: 21600 # 6h

    l3:
      enabled: true
      vectors_enabled: true
      llm_summary_enabled: true
      temporal_llm_timeout_seconds: 3.0
      temporal_llm_min_event_count: 2
      summary_interval_minutes: 60

    l4:
      enabled: true
      vectors_enabled: true

  personality:
    name: "default"
    path: "~/.magi/personalities"
    enable_evolution: true

  message_bus:
    max_queue_size: 1000
    num_workers: 4

  # Background tasks: detach long-running work from the foreground chat loop.
  # The feature flag is a hard kill-switch; when disabled the dispatcher
  # short-circuits to a foreground decision and never enqueues work.
  background_tasks:
    enabled: true
    max_concurrent: 2
    queue_when_full: true
    auto_detect_long_task: false
    auto_detect_threshold: 0.7
    default_task_timeout_seconds: 1800
    history_retention_days: 30

# =============================================================================
# Feature Flags
# =============================================================================
features:
  enable_three_layer_arch: false
  enable_skills: true
  enable_websocket: true

# =============================================================================
# Tools Configuration
# =============================================================================
tools:
  weather:
    enabled: true
    default_provider: "openmeteo"
    providers:
      openmeteo:
        base_url: ""
      qweather:
        api_key: ""
        base_url: ""

  web_search:
    enabled: true
    default_provider: "duckduckgo"
    providers:
      duckduckgo:
        base_url: ""
      brave:
        api_key: ""
      perplexity:
        api_key: ""
      searxng:
        base_url: ""
      tavily:
        api_key: ""

  web_fetch:
    enabled: true
    default_provider: "http"
    allow_rfc2544_benchmark_range: true
    allow_private_network: false
    private_network_allowlist: []
    providers:
      http:
        base_url: ""
      browser:
        base_url: ""
      curl:
        base_url: ""

# =============================================================================
# Plugins
# =============================================================================
plugins:
  scan_paths:
    - "plugins"
    - "~/.magi/plugins"
  packages:
    core-tools:
      enabled: true
      trusted: true
      source: "builtin"
      settings: {}
# =============================================================================
# Global Settings
# =============================================================================
preferences:
  default_chat_workspace_path: "~/.magi/chat-workspace"
  desktop_notifications_enabled: true
  desktop_notification_previews_enabled: true
  conversation_rhythm_enabled: true
  conversation_rhythm_mode: "natural"
  allow_media_grounding_for_conversation: true

diagnostics:
  full_content_logging_enabled: true

debug: false
log_level: "INFO"
