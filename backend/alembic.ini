# Alembic multi-environment configuration for Magi runtime SQLite databases.
#
# Recommended workflow: use the wrapped CLI which auto-resolves runtime
# paths from the active RuntimePaths layout —
#
#     python -m magi.db upgrade [target]
#     python -m magi.db current [target]
#     python -m magi.db history [target]
#     python -m magi.db revision <target> -m "describe change"
#     python -m magi.db downgrade <target> <revision>
#
# Use raw `alembic -c alembic.ini -n <target>` only when overriding the
# DB URL directly via `-x dburl=sqlite:///path/to/db.db`.

[alembic]
script_location = src/magi/db/migrations/chat

[chat]
script_location = src/magi/db/migrations/chat

[l1]
script_location = src/magi/db/migrations/l1

[memory_shared]
script_location = src/magi/db/migrations/memory_shared

[runtime_trace]
script_location = src/magi/db/migrations/runtime_trace

[llm_usage]
script_location = src/magi/db/migrations/llm_usage

[persona_registry]
script_location = src/magi/db/migrations/persona_registry
