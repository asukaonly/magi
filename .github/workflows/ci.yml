name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly canonical full run (single-process backstop) at 02:00 CST / 18:00 UTC.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select validation scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      plugin_runtime: ${{ steps.scope.outputs.plugin_runtime }}
      gateway: ${{ steps.scope.outputs.gateway }}
      desktop: ${{ steps.scope.outputs.desktop }}
      rust_security: ${{ steps.scope.outputs.rust_security }}
      backend_targets: ${{ steps.scope.outputs.backend_targets }}
    steps:
      - name: Checkout complete diff history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check immutable GitHub Action pins
        run: python3 scripts/check-workflow-action-pins.py
      - name: Test change selection
        run: python3 backend/tests/scripts/test_ci_scope.py
      - name: Select jobs and backend tests
        id: scope
        run: python3 scripts/ci_scope.py

  plugin-runtime:
    needs: changes
    if: needs.changes.outputs.plugin_runtime == 'true'
    name: Paired real workers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Reviewed companion package snapshot. Update only to a published full SHA;
      # scripts/plugin_runtime_ci.py records both revisions and the SDK pin.
      MAGI_PLUGINS_SHA: c9ac626458d97faf5f0ed9e2b394f96944e68fc1
      PYTHONUTF8: "1"
    steps:
      - name: Checkout host under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Checkout pinned companion packages
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: asukaonly/magi-plugins
          ref: ${{ env.MAGI_PLUGINS_SHA }}
          path: .paired-plugins
      - name: Set up supported plugin Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install this host SDK and backend test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install ./sdk "./backend[dev]"
      - name: Check bundled inference dependencies
        run: python backend/run_server.py --check-inference-runtime
      - name: Check native workers and official package registration
        run: >-
          python scripts/plugin_runtime_ci.py
          --plugins-repo .paired-plugins --report-dir runtime-results
          --pair-source host-ci --expected-host-sha ${{ github.sha }}
          --expected-plugins-sha ${{ env.MAGI_PLUGINS_SHA }}
      - name: Preserve paired worker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-runtime-${{ matrix.os }}
          path: runtime-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit frontend build dependencies
        working-directory: frontend
        run: npm run audit:build

      - name: Validate frontend
        working-directory: frontend
        run: npm run check:full

  backend:
    timeout-minutes: 105
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Check immutable GitHub Action pins
        run: python scripts/check-workflow-action-pins.py

      - name: Set up Node.js for project verifier tests
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project verifier test dependencies
        working-directory: frontend
        run: |
          npm install -g npm@11.16.0
          npm ci --ignore-scripts
          node scripts/patch-picomatch.mjs

      - name: Test dependency installer
        run: python scripts/test-install-deps.py

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e ../sdk
          pip install -e ".[dev]"

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Run backend smoke validation
        run: ./scripts/run-backend-smoke.sh

      - name: Run backend type gate
        run: ./scripts/run-backend-type-gate.sh

      - name: Lint backend
        working-directory: backend
        run: python -m ruff check src/magi

      - name: Run backend test suite
        working-directory: backend
        # Nightly keeps the single-process ordering backstop with room for runner variance.
        timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 45 }}
        env:
          BACKEND_TEST_TARGETS: ${{ needs.changes.outputs.backend_targets }}
        run: |
          python - <<'PYTEST'
          import json
          import os
          import subprocess
          import sys

          targets = json.loads(os.environ["BACKEND_TEST_TARGETS"])
          if not targets:
              raise SystemExit("Backend validation requires a non-empty test selection")
          command = [sys.executable, "-m", "pytest", *targets]
          if os.environ["GITHUB_EVENT_NAME"] != "schedule":
              command += ["-n", "auto", "--maxschedchunk=16"]
          command += ["-vv", "--tb=short", "--maxfail=1", "--durations=20",
                      "-o", "faulthandler_timeout=120"]
          raise SystemExit(subprocess.call(command))
          PYTEST

      - name: Run headless evaluation client tests
        run: python -m pytest -q benchmark/tests

      - name: Check import layer contracts
        working-directory: backend
        run: lint-imports

      - name: Check gateway API contract
        run: python scripts/check-api-contract.py

      - name: Check SQLite ownership contract
        run: python scripts/check-sqlite-ownership.py

      - name: Check frontend response contracts
        run: python scripts/export-frontend-contracts.py --check

      - name: Export Python OpenAPI contract
        run: python scripts/export-python-openapi.py --output /tmp/magi-python-openapi.json

  rust-security:
    needs: changes
    if: needs.changes.outputs.rust_security == 'true'
    name: Rust dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Python for security checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Verify reviewed GLib backport
        run: python3 scripts/check-vendored-glib.py

      - name: Install GLib development libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config

      - name: Test GLib safety fix with optimization
        run: cargo test --manifest-path vendor/glib/Cargo.toml --release --lib variant_iter::tests

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit Rust dependencies
        run: python scripts/check-rust-advisories.py

      - name: Install local advisory matcher
        run: python3 -m pip install -r scripts/security-audit-requirements.txt

      - name: Cross-check GitHub advisories locally
        run: python3 scripts/check-rust-github-advisories.py

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    name: Gateway validation (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Run gateway tests
        run: cargo test --locked -p magi-gateway

      - name: Check Rust dependency boundaries
        run: python scripts/check-rust-boundaries.py

      - name: Test independent server runtime
        run: cargo test --locked -p magi-service-contract -p magi-server-runtime -p magi-server

      - name: Exercise real Python lifecycle failures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv .lifecycle-venv
          .lifecycle-venv/bin/python -m pip install ./sdk
          .lifecycle-venv/bin/python scripts/smoke-service-lifecycle.py --executable target/debug/magi-server

  desktop-shell:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Desktop shell validation (${{ matrix.name }})
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MAGI_BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            target: aarch64-apple-darwin
            bundle: app
            python_sha256: 7a2384641584ab9984221fcb0fc9265df465922af71be71410529e2a9c3f0540
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            python_sha256: 2e0fed09d48989f64c9305da9ff2d37a41c0d13ab2aa6283405b2b620dfbf805
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for scoped shell checks
        if: needs.changes.outputs.full != 'true'
        working-directory: frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Set up packaging bootstrap Python
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: scripts/release-requirements/${{ matrix.target }}.txt

      - name: Download verified packaging and plugin Python
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          python scripts/prepare-plugin-python-runtime.py \
            --target "${{ matrix.target }}" \
            --asset-url "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.13.18%2B20261110-${{ matrix.target }}-install_only_stripped.tar.gz" \
            --asset-sha256 "${{ matrix.python_sha256 }}" \
            --output "${RUNNER_TEMP}/magi-plugin-python" --github-env "${GITHUB_ENV}"

      - name: Create isolated packaging interpreter
        if: needs.changes.outputs.full == 'true'
        shell: python
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          import os, subprocess
          from pathlib import Path
          windows = os.name == "nt"
          runtime = Path(os.environ["MAGI_PLUGIN_PYTHON_SOURCE"])
          python = runtime / ("python.exe" if windows else "bin/python3")
          venv = Path(".venv-release").resolve()
          subprocess.run([python, "-m", "venv", venv], check=True)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              print(venv / ("Scripts" if windows else "bin"), file=output)
          pins = Path("scripts/release-requirements", os.environ["BUILD_TARGET"] + ".txt").resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print(f"PIP_CONSTRAINT={pins}", f"PIP_BUILD_CONSTRAINT={pins}", sep="\n", file=output)

      - name: Install locked freezer and runtime dependencies
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          python -m pip install --no-deps -r "${PIP_CONSTRAINT}"
          python -m pip install --no-deps -e ./sdk -e ./backend
          python -m pip check
          python backend/run_server.py --check-storage-runtime chroma

      - name: Stage verified native ripgrep
        if: needs.changes.outputs.full == 'true'
        run: python scripts/prepare-ripgrep.py "${{ matrix.target }}"

      - name: Build desktop candidate without release keys
        if: needs.changes.outputs.full == 'true'
        working-directory: frontend
        shell: bash
        run: |
          npm exec -- tauri build --target "${MAGI_BUILD_TARGET}" --bundles "${{ matrix.bundle }}" \
            --config src-tauri/tauri.candidate.conf.json

      - name: Validate service in the macOS app
        if: needs.changes.outputs.full == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          app="target/${MAGI_BUILD_TARGET}/release/bundle/macos/Magi.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 15.0
          python scripts/smoke-service-bundle.py --require-chroma --bundle "$app/Contents/Resources/server-dist" --deny-checkout "$GITHUB_WORKSPACE"

      - name: Install Windows candidate and validate bundled service
        if: needs.changes.outputs.full == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = "target/$env:MAGI_BUILD_TARGET/release/bundle/nsis/Magi_${version}_x64-setup.exe"
          $install = Join-Path $env:RUNNER_TEMP 'Magi Candidate'
          $process = Start-Process -FilePath $setup -ArgumentList "/S /D=$install" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          python scripts/smoke-service-bundle.py --require-chroma --bundle "$install/server-dist"

      - name: Archive the checked candidate for release
        if: needs.changes.outputs.full == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          candidate=macos/Magi.app
          if [[ "$RUNNER_OS" == Windows ]]; then candidate="nsis/Magi_$(cat VERSION)_x64-setup.exe"; fi
          tar -cf desktop-candidate.tar -C "target/${MAGI_BUILD_TARGET}/release/bundle" "$candidate"

      - name: Store the checked candidate
        if: needs.changes.outputs.full == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-candidate.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Prepare empty packaged-resource directory
        shell: bash
        run: mkdir -p frontend/src-tauri/server-dist

      - name: Test desktop shell independently
        run: cargo test --locked -p magi-desktop

      - name: Test native storage protection
        run: cargo test --locked -p magi-platform

      - name: Check independent service
        run: cargo check --locked -p magi-server

  ci-result:
    name: CI result
    if: always()
    needs: [changes, plugin-runtime, frontend, backend, rust-security, gateway, desktop-shell]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          required = {"changes"}
          scope = jobs["changes"]["outputs"]
          for name, output in {
              "backend": "backend", "frontend": "frontend", "plugin-runtime": "plugin_runtime",
              "gateway": "gateway", "desktop-shell": "desktop", "rust-security": "rust_security",
          }.items():
              if scope.get(output) == "true":
                  required.add(name)
          failed = [name for name, job in jobs.items()
                    if job["result"] != "success"
                    and (name in required or job["result"] != "skipped")]
          if failed:
              raise SystemExit(f"Validation did not complete successfully: {failed}")
          PY

  full-validation:
    name: Full validation
    needs: [changes, ci-result]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Complete cross-platform validation passed for this commit."
