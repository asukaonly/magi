name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly canonical full run (single-process backstop) at 02:00 CST / 18:00 UTC.
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend import boundaries
        working-directory: frontend
        run: npm run check:boundaries

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Check immutable GitHub Action pins
        run: python scripts/check-workflow-action-pins.py

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e ".[dev]"

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Run backend smoke validation
        run: ./scripts/run-backend-smoke.sh

      - name: Run backend type gate
        run: ./scripts/run-backend-type-gate.sh

      - name: Lint backend
        working-directory: backend
        run: python -m ruff check src/magi

      - name: Run backend test suite
        working-directory: backend
        timeout-minutes: 15
        # PR + push to main: run the full suite in parallel (pytest-xdist) for
        # fast full-coverage feedback. Nightly (schedule): canonical single-process
        # run as a backstop in case parallelism ever masks an ordering-dependent
        # failure. Coverage is identical across both; only the runner differs.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m pytest -q
          else
            python -m pytest -n auto -q
          fi

      - name: Run headless evaluation client tests
        run: python -m pytest -q benchmark/tests

      - name: Check import layer contracts
        working-directory: backend
        run: lint-imports

      - name: Check gateway API contract
        run: python scripts/check-api-contract.py

      - name: Check SQLite ownership contract
        run: python scripts/check-sqlite-ownership.py

      - name: Export Python OpenAPI contract
        run: python scripts/export-python-openapi.py --output /tmp/magi-python-openapi.json

  rust-security:
    name: Rust dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit Rust dependencies
        run: python scripts/check-rust-advisories.py

  gateway:
    name: Gateway validation (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Run gateway tests
        run: cargo test -p magi-gateway

      - name: Check headless gateway
        run: cargo check -p magi-gateway-cli

  desktop-shell:
    name: Desktop shell validation (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Prepare empty packaged-resource directory
        shell: bash
        run: mkdir -p frontend/src-tauri/sidecar-dist

      - name: Check desktop shell
        run: cargo check -p magi-desktop
