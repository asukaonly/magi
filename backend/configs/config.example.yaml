# Magi Agent Configuration
#
# This is the example configuration file.
# On first run, it will be copied to ~/.magi/config/agent.yaml.
#
# LLM defaults are generated from backend/configs/llm_providers.yaml.
# Runtime overrides are persisted to ~/.magi/config/llm.yaml.

# =============================================================================
# Agent Configuration
# =============================================================================
agent:
  name: "magi-agent"
  num_task_agents: 2
  loop_interval: 1.0
  enable_monitoring: true

  memory:
    db_path: "~/.magi/data/memories"
    embedding:
      mode: "remote"  # "remote" or "local"
      local:
        model_source: "managed"  # "managed" or "external"
        managed_model_id: null
        model_dir_path: null
        idle_timeout_seconds: 1800
    reranker:
      enabled: false
      backend: "heuristic"
      mode: "local"
      layers: ["L1", "L3"]
      top_k: 8
      timeout_seconds: 0.8
      candidate_max_chars: 500
      local:
        model_source: "managed"
        managed_model_id: null
        model_file_path: null
        max_context_tokens: 2048
      remote:
        provider_id: ""
        model: ""

    l0:
      enabled: true
      checkpoint_interval_seconds: 30
      runtime_replay_include_l0_only: false

    l1:
      enabled: true
      retention_days: 7
      t1_importance_enabled: true
      vectors_enabled: true

    l2:
      enabled: true
      batch_flush_interval_seconds: 60
      llm_extraction_enabled: true
      auto_extract_relations: true
      conflict_arbitration_enabled: true
      conflict_arbitration_min_confidence: 0.85
      # Background catalog/graph cleanup (runtime worker only). Skipped when L2 is disabled.
      maintenance_enabled: true
      maintenance_interval_seconds: 86400
      maintenance_min_mentions: 2

    l3:
      enabled: true
      vectors_enabled: true
      llm_summary_enabled: true
      temporal_llm_timeout_seconds: 3.0
      temporal_llm_min_event_count: 2
      summary_interval_minutes: 60

    l4:
      enabled: true
      vectors_enabled: true
      skill_extraction_enabled: true

  personality:
    name: "default"
    path: "~/.magi/personalities"
    enable_evolution: true

  message_bus:
    max_queue_size: 1000
    num_workers: 4

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  reload: true
  debug: false
  desktop_session_token: ""
  cors_origins: ["*"]

# =============================================================================
# Feature Flags
# =============================================================================
features:
  enable_three_layer_arch: false
  enable_skills: true
  enable_websocket: true

# =============================================================================
# Tools Configuration
# =============================================================================
tools:
  weather:
    enabled: true
    default_provider: "qweather"
    providers:
      qweather:
        api_key: ""
        base_url: ""

  web_search:
    enabled: true
    default_provider: "duckduckgo"
    providers:
      duckduckgo:
        base_url: ""
      brave:
        api_key: ""
      perplexity:
        api_key: ""
      tavily:
        api_key: ""

  web_fetch:
    enabled: true
    default_provider: "http"
    providers:
      http:
        base_url: ""
      browser:
        base_url: ""
      curl:
        base_url: ""

# =============================================================================
# Plugins
# =============================================================================
plugins:
  scan_paths:
    - "plugins"
    - "~/.magi/plugins"
  packages:
    core-tools:
      enabled: true
      trusted: true
      source: "builtin"
      settings: {}
    core-timeline:
      enabled: true
      trusted: true
      source: "builtin"
      settings:
        sensors:
          chat:
            enabled: true
            sync_mode: "watch"
            sync_interval_minutes: 1
            default_retention_mode: "analyze_only"
            storage_mode: "managed"
            edge_whitelist: ["MENTIONED", "CARES_ABOUT", "LIKES", "DISLIKES", "INTERACTED_WITH"]
          manual_journal:
            enabled: true
            sync_mode: "manual"
            sync_interval_minutes: 1
            default_retention_mode: "retain_raw"
            storage_mode: "managed"
            edge_whitelist:
              ["MENTIONED", "CARES_ABOUT", "LIKES", "DISLIKES", "CREATED", "RELATED_TO"]
          browser_history:
            enabled: true
            sync_mode: "interval"
            sync_interval_minutes: 30
            default_retention_mode: "analyze_only"
            storage_mode: "managed"
            source_path: ""
            fetch_page_content: false
            edge_whitelist: ["VIEWED", "VISITED", "CARES_ABOUT", "LIKES"]
          photo_library:
            enabled: true
            sync_mode: "interval"
            sync_interval_minutes: 60
            default_retention_mode: "retain_raw"
            storage_mode: "external_reference"
            source_path: ""
            edge_whitelist: ["CAPTURED", "RELATED_TO", "INTERACTED_WITH", "CREATED"]
    core-actions:
      enabled: true
      trusted: true
      source: "builtin"
      settings:
        notifications:
          default_level: "info"
        email:
          default_sender: ""
          provider_mode: "simulated"

# =============================================================================
# Global Settings
# =============================================================================
preferences:
  default_chat_workspace_path: "~/.magi/chat-workspace"

debug: false
log_level: "INFO"
