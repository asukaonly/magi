providers:
  - id: openai
    display_name: OpenAI
    description: General purpose, strongest ecosystem
    icon: openai
    default_model: gpt-5.5
    default_classify_model: gpt-5.2
    default_base_url: https://api.openai.com/v1
    chat_models:
      - id: gpt-5.5
        label: GPT-5.5
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 1050000
          max_output_tokens: 128000
          max_concurrency: 2
        cost:
          currency: USD
          input_per_million_tokens: 5.0
          cached_input_per_million_tokens: 0.5
          output_per_million_tokens: 30.0
          source: https://developers.openai.com/api/docs/models/gpt-5.5
      - id: gpt-5.4
        label: GPT-5.4
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 1050000
          max_output_tokens: 128000
          max_concurrency: 2
        cost:
          currency: USD
          input_per_million_tokens: 2.5
          cached_input_per_million_tokens: 0.25
          output_per_million_tokens: 15.0
          source: https://developers.openai.com/api/docs/models/gpt-5.4
      - id: gpt-5
        label: GPT-5
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 400000
          max_output_tokens: 128000
          max_concurrency: 3
        cost:
          currency: USD
          input_per_million_tokens: 1.25
          cached_input_per_million_tokens: 0.125
          output_per_million_tokens: 10.0
          source: https://openai.com/api/pricing/
      - id: gpt-5.2
        label: GPT-5.2
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 400000
          max_output_tokens: 128000
          max_concurrency: 2
        cost:
          currency: USD
          input_per_million_tokens: 1.75
          cached_input_per_million_tokens: 0.175
          output_per_million_tokens: 14.0
          source: https://openai.com/api/pricing/
      - id: o3
        label: o3
        capabilities:
          vision: true
          image_output: false
          tool_calling: true
          reasoning: true
        limits:
          context_window: 200000
          max_output_tokens: 100000
          max_concurrency: 2
        cost:
          currency: USD
          input_per_million_tokens: 2.0
          cached_input_per_million_tokens: 0.5
          output_per_million_tokens: 8.0
          source: https://openai.com/api/pricing/
    embedding_models:
      - id: text-embedding-3-small
        label: Text Embedding 3 Small
        dimensions: [1536, 512]
        limits:
          max_concurrency: 6
        cost:
          currency: USD
          input_per_million_tokens: 0.02
          source: https://openai.com/api/pricing/
      - id: text-embedding-3-large
        label: Text Embedding 3 Large
        dimensions: [3072, 1024, 256]
        limits:
          max_concurrency: 4
        cost:
          currency: USD
          input_per_million_tokens: 0.13
          source: https://openai.com/api/pricing/
    image_generation_models:
      - id: gpt-image-1
        label: GPT Image 1
        supported_sizes: [1024x1024, 1536x1024, 1024x1536]
        supported_qualities: [auto, high, medium, low]
        supports_seed: false
        supports_negative_prompt: false
        supports_reference: false
        max_n: 1
        native_protocol: openai_images
        cost:
          currency: USD
          per_image: 0.042
          source: https://openai.com/api/pricing/
          source_note: Medium-quality square image estimate; final cost varies by size, quality, and image token usage.
      - id: dall-e-3
        label: DALL·E 3
        supported_sizes: [1024x1024, 1792x1024, 1024x1792]
        supported_qualities: [auto, high, medium, low]
        supports_seed: false
        supports_negative_prompt: false
        supports_reference: false
        max_n: 1
        native_protocol: openai_images
        cost:
          currency: USD
          per_image: 0.04
          source: https://openai.com/api/pricing/
          source_note: Base 1024x1024 standard-quality image price for legacy DALL-E 3; high quality and wide/tall sizes cost more.
    audio_generation_models:
      - id: gpt-4o-mini-tts
        label: GPT-4o Mini TTS
    fields:
      model:
        visible: true
        required: true
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false

