[package]
name = "magi-delivery"
version = "0.1.0"
edition = "2021"
description = "Private durable producer queues for background facts"

[dependencies]
magi-service-contract = { path = "../magi-service-contract" }
magi-platform = { path = "../magi-platform" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
