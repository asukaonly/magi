name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e ".[dev]"

      - name: Run backend smoke validation
        run: ./scripts/run-backend-smoke.sh

      - name: Run backend type gate
        run: ./scripts/run-backend-type-gate.sh

      - name: Run backend test suite
        working-directory: backend
        timeout-minutes: 15
        run: python -m pytest -q

      - name: Check import layer contracts
        working-directory: backend
        run: lint-imports

      - name: Check gateway API contract
        run: python scripts/check-api-contract.py

      - name: Check SQLite ownership contract
        run: python scripts/check-sqlite-ownership.py

      - name: Export Python OpenAPI contract
        run: python scripts/export-python-openapi.py --output /tmp/magi-python-openapi.json

  gateway:
    name: Gateway validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run gateway tests
        run: cargo test -p magi-gateway

  api-types-drift:
    name: Generated API types in sync with backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (for FastAPI OpenAPI export)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate API types
        run: bash scripts/gen-api-types.sh

      - name: Assert generated.ts is committed up to date
        run: |
          if ! git diff --exit-code -- frontend/src/types/api/generated.ts; then
            echo "::error::frontend/src/types/api/generated.ts is stale."
            echo "Run 'bash scripts/gen-api-types.sh' locally and commit the result."
            exit 1
          fi
