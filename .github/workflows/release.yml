name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Publish desktop bundle (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write
    env:
      MAGI_PLUGIN_PYTHON_VERSION: "3.13"

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os_family: macos
            bundles: app,dmg
          - label: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            os_family: macos
            bundles: app,dmg
          - label: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_family: windows
            bundles: nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"

      - name: Use Homebrew Python venv on macOS
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          if ! brew list python@3.13 >/dev/null 2>&1; then
            brew install python@3.13 || brew list python@3.13 >/dev/null 2>&1
          fi
          python_prefix="$(brew --prefix python@3.13)"
          venv_path="${GITHUB_WORKSPACE}/.venv-release"
          "${python_prefix}/libexec/bin/python" -m venv "${venv_path}"
          echo "${venv_path}/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${venv_path}" >> "$GITHUB_ENV"
          # GitHub's setup-python builds on macOS do not expose SQLite loadable
          # extension support. sqlite-vec requires it to register vec0 tables.
          "${venv_path}/bin/python" - <<'PY'
          import sqlite3
          import sys

          conn = sqlite3.connect(":memory:")
          try:
              if not hasattr(conn, "enable_load_extension"):
                  raise SystemExit(
                      "Homebrew Python sqlite3 is missing enable_load_extension"
                  )
              print(f"Using {sys.executable} with SQLite {sqlite3.sqlite_version}")
          finally:
              conn.close()
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Validate version metadata against release tag
        shell: bash
        run: |
          python scripts/release-version.py validate --tag "${GITHUB_REF_NAME}"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ../sdk
          pip install -e ".[dev]" pyinstaller

      - name: Install ripgrep (macOS)
        if: matrix.os_family == 'macos'
        shell: bash
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep

      - name: Install ripgrep (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: choco install ripgrep -y

      - name: Prepare plugin Python runtime (Unix)
        if: matrix.os_family != 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/prepare-plugin-python-runtime.py \
            --target "${{ matrix.target }}" \
            --python-version "${MAGI_PLUGIN_PYTHON_VERSION}" \
            --output "${RUNNER_TEMP}/magi-plugin-python" \
            --github-env "${GITHUB_ENV}"

      - name: Prepare plugin Python runtime (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/prepare-plugin-python-runtime.py `
            --target "${{ matrix.target }}" `
            --python-version "$env:MAGI_PLUGIN_PYTHON_VERSION" `
            --output "$env:RUNNER_TEMP/magi-plugin-python" `
            --github-env "$env:GITHUB_ENV"

      - name: Build Python sidecar (Unix)
        if: matrix.os_family != 'windows'
        shell: bash
        run: ./scripts/build-sidecar.sh

      - name: Build Python sidecar (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Run frontend validation
        working-directory: frontend
        shell: bash
        run: |
          npm run type-check
          npm run test:ci
          npm run lint

      - name: Run backend smoke validation
        shell: bash
        run: ./scripts/run-backend-smoke.sh

      - name: Run backend type gate
        shell: bash
        run: ./scripts/run-backend-type-gate.sh

      - name: Check gateway API contract
        shell: bash
        run: python scripts/check-api-contract.py

      - name: Check SQLite ownership contract
        shell: bash
        run: python scripts/check-sqlite-ownership.py

      - name: Export Python OpenAPI contract
        shell: bash
        run: python scripts/export-python-openapi.py --output /tmp/magi-python-openapi.json

      - name: Run gateway validation
        shell: bash
        run: |
          cargo test -p magi-gateway
          cargo check -p magi-gateway-cli

      - name: Run headless evaluation client tests
        shell: bash
        run: python -m pytest -q benchmark/tests

      - name: Export optional macOS signing secrets
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_PASSWORD }}" ]; then
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Build release notes from commits
        id: release_notes
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-v:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"
          max_release_note_commits=200

          if [ -n "${previous_tag}" ]; then
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
            heading="## Changes since ${previous_tag}"
            commit_range="${previous_tag}..${current_tag}"
          else
            compare_url=""
            heading="## Initial release"
            commit_range="${current_tag}"
          fi

          commit_count="$(git rev-list --no-merges --count "${commit_range}")"
          commit_lines="$(git log --no-merges --max-count="${max_release_note_commits}" --pretty='- %s (%h)' "${commit_range}")"

          if [ -z "${commit_lines}" ]; then
            commit_lines="- No user-facing commits found in this release."
          elif [ "${commit_count}" -gt "${max_release_note_commits}" ]; then
            omitted_count=$((commit_count - max_release_note_commits))
            commit_lines="${commit_lines}"$'\n\n'"_Showing latest ${max_release_note_commits} commits; ${omitted_count} older commits omitted from these notes._"
          fi

          {
            echo "title=Magi ${current_tag}"
            echo "body<<EOF"
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | \`Magi_${current_tag#v}_aarch64.dmg\` |"
            echo "| macOS (Intel) | \`Magi_${current_tag#v}_x64.dmg\` |"
            echo "| Windows | \`Magi_${current_tag#v}_x64-setup.exe\` |"
            echo
            echo "> Other assets (\`.app.tar.gz\`, \`.sig\`, \`.json\`) are for the built-in auto-updater. No manual download needed."
            echo
            echo "${heading}"
            echo
            echo "${commit_lines}"
            if [ -n "${compare_url}" ]; then
              echo
              echo "**Full Changelog**: ${compare_url}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: ${{ matrix.os_family == 'macos' && '../scripts/tauri-build-macos.sh' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.release_notes.outputs.title }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
