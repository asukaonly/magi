providers:
  - id: openai
    icon: sparkles
    default_model: gpt-5.2
    default_base_url: https://api.openai.com/v1
    model_options:
      - gpt-5
      - gpt-5.2
      - o3
      - o4-mini
    fields:
      model:
        visible: true
        required: true
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false
  - id: anthropic
    icon: brain
    default_model: claude-opus-4-6
    default_base_url: https://api.anthropic.com/v1
    model_options:
      - claude-sonnet-4-6
      - claude-opus-4-6
      - claude-haiku-4-5
    fields:
      model:
        visible: true
        required: true
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false
  - id: glm
    icon: zap
    default_model: glm-4.7
    default_base_url: https://open.bigmodel.cn/api/paas/v4
    model_options:
      - glm-5
      - glm-4.7
      - glm-4.7-flash
      - glm-4.7-flashx
      - glm-4.6
    fields:
      model:
        visible: true
        required: true
      api_key:
        visible: true
        required: true
      base_url:
        visible: true
        required: false
custom_provider:
  enabled: true
  icon: wand
  fields:
    custom_name:
      visible: true
      required: true
      placeholder: My Provider
    api_format:
      visible: true
      required: true
      options:
        - openai
        - anthropic
        - custom
    model:
      visible: true
      required: true
    api_key:
      visible: true
      required: true
    base_url:
      visible: true
      required: false
