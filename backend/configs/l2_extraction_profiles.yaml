# L2 Extraction Profiles
#
# Each profile controls which entity types, predicates, and assertion families
# are allowed during L2 knowledge extraction for a given event source.
#
# Special values:
#   allowed_entity_types: all   → accepts all registered entity types
#   allowed_predicates: all     → accepts all registered predicates
#   allowed_assertion_families: all → accepts all registered assertion families

profiles:
  chat.user_message:
    source_types:
      - chat
    allowed_entity_types: all
    allowed_predicates: all
    allow_graph: true
    allow_assertion: true
    extraction_instructions: |
      These events are direct user-authored chat messages.

      Prioritize durable self-descriptive facts the user states about themself,
      especially during early onboarding-style exchanges.

      Focus areas:
      - Self-identification: the user's real name when explicitly stated.
      - Address preferences: nicknames, forms of address, or names the user says
        are acceptable or unacceptable.
      - Explicit likes, dislikes, interests, favorite topics, and hobbies.

      Addressing extraction guidance:
      - Treat stated names, nicknames, and forms of address as profile signals
        for the integration phase rather than as graph entities about the
        preference category itself.
      - Use Phase 1 profile-signal predicates such as REAL_NAME, BIRTH_DATE,
        BIRTH_YEAR, STATED_AGE, PREFERRED_FORM_OF_ADDRESS,
        DISALLOWED_FORM_OF_ADDRESS, or
        PREFERRED_COMMUNICATION_STYLE for these facts.
      - Keep the user's exact stated address/name text as the value evidence.
      - Do not emit LIKES, DISLIKES, or INTERESTED_IN fact claims for a name
        or nickname merely because the user says how they want to be addressed.
      - Do not extract internal schema names, preference category labels, or
        output-field names as entity names, graph predicates, or graph objects.
      - For multiple accepted or disallowed forms, preserve each current form
        explicitly in the value evidence.

      Extraction rules:
      - Only extract what the user explicitly states. Do not infer from the assistant.
      - If the user corrects an earlier self-description, prefer the newer statement.
      - Treat forms of address and nicknames as preference signals unless the user
        clearly says they are their real name.
      - Preserve the user's exact wording when it matters for preference or naming.
      - Skip transient logistics unless they reveal a stable preference or identity fact.

  chat.first_context_story:
    source_types:
      - chat
    allowed_entity_types: all
    allowed_predicates: all
    allow_graph: true
    allow_assertion: true
    extraction_instructions: |
      This event is a direct user answer to one fixed onboarding question.

      The question context is provided only to interpret a short or elliptical
      answer. It is not a user claim and must never be used as evidence.

      Extraction rules:
      - Extract only explicit self-reports, durable preferences, stable profile
        facts, or clearly stated current/recent situations.
      - For a mixed message containing both a self-report and a request or
        question, extract only the self-report clause.
      - Return no facts, entities, relationships, or profile signals for
        gibberish, placeholders, numeric-only input, or content with no
        meaningful self-report.
      - Do not infer stable traits from one-off behavior.
