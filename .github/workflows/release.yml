name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify release commit CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_ids="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${GITHUB_SHA}" \
              --status success \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId'
          )"
          for run_id in ${run_ids}; do
            full="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json jobs \
              --jq '[.jobs[] | select(.name == "Full validation" and .conclusion == "success")] | length')"
            if [ "${full}" = "1" ]; then
              echo "Release commit ${GITHUB_SHA} passed full CI in run ${run_id}."
              exit 0
            fi
          done
          echo "No successful full ci.yml run found for release commit ${GITHUB_SHA}." >&2
          exit 1

  publish-tauri:
    name: Build desktop candidate (${{ matrix.label }})
    needs: verify-ci
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            os_family: macos
            bundles: app,dmg
            python_sha256: 7a2384641584ab9984221fcb0fc9265df465922af71be71410529e2a9c3f0540
          - label: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_family: windows
            bundles: nsis
            python_sha256: 2e0fed09d48989f64c9305da9ff2d37a41c0d13ab2aa6283405b2b620dfbf805

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Set up packaging bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: scripts/release-requirements/${{ matrix.target }}.txt

      - name: Download verified packaging and plugin Python
        shell: bash
        run: |
          python scripts/prepare-plugin-python-runtime.py \
            --target "${{ matrix.target }}" \
            --asset-url "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.13.18%2B20261110-${{ matrix.target }}-install_only_stripped.tar.gz" \
            --asset-sha256 "${{ matrix.python_sha256 }}" \
            --output "${RUNNER_TEMP}/magi-plugin-python" --github-env "${GITHUB_ENV}"

      - name: Create isolated packaging interpreter
        shell: python
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          import os, subprocess
          from pathlib import Path
          windows = os.name == "nt"
          runtime = Path(os.environ["MAGI_PLUGIN_PYTHON_SOURCE"])
          python = runtime / ("python.exe" if windows else "bin/python3")
          venv = Path(".venv-release").resolve()
          subprocess.run([python, "-m", "venv", venv], check=True)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              print(venv / ("Scripts" if windows else "bin"), file=output)
          pins = Path("scripts/release-requirements", os.environ["BUILD_TARGET"] + ".txt").resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print(f"PIP_CONSTRAINT={pins}", f"PIP_BUILD_CONSTRAINT={pins}", sep="\n", file=output)

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target

      - name: Validate version metadata against release tag
        shell: bash
        run: |
          python scripts/release-version.py validate --tag "${GITHUB_REF_NAME}"

      - name: Install locked freezer and runtime dependencies
        shell: bash
        run: |
          python -m pip install --no-deps -r "${PIP_CONSTRAINT}"
          python -m pip install --no-deps --no-build-isolation -e ./sdk -e ./backend
          python -m pip check

      - name: Install ripgrep (macOS)
        if: matrix.os_family == 'macos'
        shell: bash
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep

      - name: Install ripgrep (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: choco install ripgrep -y

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Export optional macOS signing secrets
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_PASSWORD }}" ]; then
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Build release notes from commits
        id: release_notes
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-v:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"
          max_release_note_commits=200

          if [ -n "${previous_tag}" ]; then
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
            heading="## Changes since ${previous_tag}"
            commit_range="${previous_tag}..${current_tag}"
          else
            compare_url=""
            heading="## Initial release"
            commit_range="${current_tag}"
          fi

          commit_count="$(git rev-list --no-merges --count "${commit_range}")"
          commit_lines="$(git log --no-merges --max-count="${max_release_note_commits}" --pretty='- %s (%h)' "${commit_range}")"

          if [ -z "${commit_lines}" ]; then
            commit_lines="- No user-facing commits found in this release."
          elif [ "${commit_count}" -gt "${max_release_note_commits}" ]; then
            omitted_count=$((commit_count - max_release_note_commits))
            commit_lines="${commit_lines}"$'\n\n'"_Showing latest ${max_release_note_commits} commits; ${omitted_count} older commits omitted from these notes._"
          fi

          {
            echo "title=Magi ${current_tag}"
            echo "body<<EOF"
            echo "## Candidate validation"
            echo
            echo "This release stays in draft until packaged desktop validation is recorded for every supported platform."
            echo "Record the commit, OS/architecture, artifact checksum, startup, native interaction, persistence and failure-recovery results before publishing. See docs/project-overview.md."
            echo
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | \`Magi_${current_tag#v}_aarch64.dmg\` |"
            echo "| Windows | \`Magi_${current_tag#v}_x64-setup.exe\` |"
            echo
            echo "macOS desktop and standalone service packages require Apple Silicon and macOS 15 or later. Intel Mac packages are no longer produced."
            echo
            echo "> Other assets (\`.app.tar.gz\`, \`.sig\`, \`.json\`) are for the built-in auto-updater. No manual download needed."
            echo
            echo "${heading}"
            echo
            echo "${commit_lines}"
            if [ -n "${compare_url}" ]; then
              echo
              echo "**Full Changelog**: ${compare_url}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build candidate Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGI_BUILD_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: ${{ matrix.os_family == 'macos' && '../scripts/tauri-build-macos.sh' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.release_notes.outputs.title }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Validate relocated standalone service
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          python scripts/smoke-service-bundle.py \
            --bundle "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/bundle/macos/Magi.app/Contents/Resources/server-dist" \
            --deny-checkout "${GITHUB_WORKSPACE}"

      - name: Package standalone Mac service candidate
        if: matrix.os_family == 'macos'
        shell: bash
        env:
          MAGI_REQUIRE_SERVICE_NOTARIZATION: "1"
        run: |
          node scripts/package-service-macos.mjs \
            --target "${{ matrix.target }}" \
            --source "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/bundle/macos/Magi.app/Contents/Resources/server-dist" \
            --signed-source

      - name: Upload standalone Mac service candidate
        if: matrix.os_family == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/packages/MagiServer_*_${{ matrix.target }}.dmg \
            build/packages/MagiServer_*_${{ matrix.target }}.dmg.sha256 \
            build/packages/MagiServer_*_${{ matrix.target }}.dmg.json \
            --clobber
