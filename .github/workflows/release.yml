name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Publish desktop bundle (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os_family: macos
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            os_family: macos
          - label: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_family: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate version metadata against release tag
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          tag = os.environ["GITHUB_REF_NAME"]
          expected_version = tag.removeprefix("v")

          versions = {
              "frontend/package.json": json.loads(
                  (root / "frontend/package.json").read_text(encoding="utf-8")
              )["version"],
              "frontend/src-tauri/tauri.conf.json": json.loads(
                  (root / "frontend/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
              )["version"],
              "frontend/src-tauri/Cargo.toml": tomllib.loads(
                  (root / "frontend/src-tauri/Cargo.toml").read_text(encoding="utf-8")
              )["package"]["version"],
              "backend/pyproject.toml": tomllib.loads(
                  (root / "backend/pyproject.toml").read_text(encoding="utf-8")
              )["project"]["version"],
          }

          mismatches = {
              path: version for path, version in versions.items() if version != expected_version
          }

          if mismatches:
              details = "\n".join(
                  f"- {path}: expected {expected_version}, found {version}"
                  for path, version in mismatches.items()
              )
              raise SystemExit(f"Release tag does not match version metadata:\n{details}")

          print(f"Validated release version {expected_version} across metadata files.")
          PY

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build Python sidecar (Unix)
        if: matrix.os_family != 'windows'
        shell: bash
        run: ./scripts/build-sidecar.sh

      - name: Build Python sidecar (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Run frontend validation
        working-directory: frontend
        shell: bash
        run: |
          npm run type-check
          npm run test:ci
          npm run lint

      - name: Run backend smoke validation
        shell: bash
        run: ./scripts/run-backend-smoke.sh

      - name: Export optional macOS signing secrets
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_PASSWORD }}" ]; then
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Build release notes from commits
        id: release_notes
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-v:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"

          if [ -n "${previous_tag}" ]; then
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
            heading="## Changes since ${previous_tag}"
            commit_lines="$(git log --no-merges --pretty='- %s (%h)' "${previous_tag}..${current_tag}")"
          else
            compare_url=""
            heading="## Initial release"
            commit_lines="$(git log --no-merges --pretty='- %s (%h)' "${current_tag}")"
          fi

          if [ -z "${commit_lines}" ]; then
            commit_lines="- No user-facing commits found in this release."
          fi

          {
            echo "title=Magi ${current_tag}"
            echo "body<<EOF"
            echo "${heading}"
            echo
            echo "${commit_lines}"
            if [ -n "${compare_url}" ]; then
              echo
              echo "**Full Changelog**: ${compare_url}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.release_notes.outputs.title }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}
