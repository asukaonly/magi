# L2 Extraction Profiles
#
# Each profile controls which entity types, predicates, and assertion families
# are allowed during L2 knowledge extraction for a given event source.
#
# Special values:
#   allowed_entity_types: all   → accepts all registered entity types
#   allowed_predicates: all     → accepts all registered predicates
#   allowed_assertion_families: all → accepts all registered assertion families

profiles:
  chat.user_message:
    allowed_entity_types: all
    allowed_predicates: all
    allow_graph: true
    allow_assertion: true

  timeline.chrome_history:
    allowed_entity_types:
      - product
      - software
      - technology
      - media
      - person
      - organization
      - topic
    allowed_predicates:
      - VISITED
      - USES
      - INTERESTED_IN
      - FOLLOWS
      - VIEWED
      - WORKS_WITH
    structured_allowed_entity_types:
      - presence
      - product
      - software
      - technology
      - media
      - person
      - group
      - organization
      - topic
    structured_allowed_predicates:
      - VISITED
      - USES
      - INTERESTED_IN
      - FOLLOWS
      - VIEWED
      - WORKS_WITH
      - ON_PLATFORM
      - PRESENCE_OF
      - LOCATED_IN
    allow_graph: true
    allow_assertion: false
    extraction_instructions: |
      These events are browser history page titles, NOT user-authored messages.
      Page titles often follow patterns like '{content} - {platform}' or
      '{content} | {platform}'. Treat the platform part (YouTube, 哔哩哔哩,
      GitHub, etc.) as a `software` entity, and the content part as the
      actual subject (media, person, project, topic).

      Predicate guidance for browsing behavior:
      - USES: only for tool/platform usage (e.g., user uses GitHub, ChatGPT)
      - INTERESTED_IN: when the user repeatedly browses content on a topic
        (e.g., AI papers, a TV show, a game)
      - VIEWED: for individual content consumption (a specific video, article)
      - FOLLOWS: when visiting a specific creator or person's page
      - WORKS_WITH: for professional tools/technologies seen in work context

      Entity extraction rules (IMPORTANT):
      - Be SELECTIVE: only extract entities that reveal user interests,
        habits, or tool usage. Not every page title deserves an entity.
      - SKIP noise: error messages, email addresses, IP addresses,
        UI element names (Home, Inbox, Schema Panel), authentication pages,
        and generic navigation titles are NOT entities.
      - MERGE related content: multiple pages about the same game, show,
        or topic should map to ONE entity with a concise canonical name,
        not one entity per page title. E.g., '燕云十六声射覆答案',
        '燕云十六声攻略', '燕云十六声金明池' → single entity '燕云十六声'.
      - Keep canonical names SHORT: use the core subject name, not the
        full page title. E.g., 'Joe Pera Talks With You' not
        'Joe Pera Talks With You 豆瓣'.
      - Only use allowed entity types: software, product, technology,
        media, person, organization, topic. Do NOT use virtual_object,
        activity, concept, skill, food, health_metric, or other.
      - Do NOT use platform names as alias_signals for content entities.
      - Keep entity types consistent: a website/app is always `software`,
        not `activity` or `organization`.

  timeline.calendar:
    allowed_entity_types:
      - activity
      - event
      - place
      - organization
    allowed_predicates:
      - ATTENDED
      - PLANS_TO
      - VISITED
    allow_graph: true
    allow_assertion: false

  timeline.netease_music:
    allowed_entity_types:
      - media
      - person
      - group
    allowed_predicates:
      - LISTENED
      - LIKES
      - INTERESTED_IN
    structured_allowed_entity_types:
      - media
      - person
      - group
    structured_allowed_predicates:
      - LISTENED
      - LIKES
      - INTERESTED_IN
    allowed_assertion_families:
      - taste_profile
      - preference_profile
    allow_graph: true
    allow_assertion: true
    extraction_instructions: |
      These events are music play records from NetEase Cloud Music. Each event
      represents one track playback with track name, artist, and album info.

      Entity extraction rules:
      - Extract the artist as a `person` (solo) or `group` (band/group) entity.
      - Extract the track/album as a `media` entity only when it reveals a
        genuine listening pattern — skip one-off plays.
      - LISTENED: for individual track plays (graph edge).
      - LIKES: when the user explicitly liked a track (is_liked flag in provenance).
      - INTERESTED_IN: only for recurring artists or genres.
      - Keep entity names concise: use the canonical artist name, not
        "artist_name - track_name".

      Assertion rules:
      - taste_profile assertions capture music taste dimensions, e.g.,
        trait_name: "music.genre", trait_value: "indie_rock".
      - preference_profile assertions capture specific artist/genre preferences.
      - Only assert preferences when there is genuine frequency signal
        (multiple plays), not from a single listen.

  timeline.git_activity:
    allowed_entity_types:
      - software
      - technology
      - topic
    allowed_predicates:
      - COMMITTED
      - CHECKED_OUT
      - MERGED
      - REBASED
      - WORKS_WITH
      - USES
    structured_allowed_entity_types:
      - software
      - technology
      - topic
    structured_allowed_predicates:
      - COMMITTED
      - CHECKED_OUT
      - MERGED
      - REBASED
      - WORKS_WITH
      - USES
    allow_graph: true
    allow_assertion: false
    extraction_instructions: |
      These events are git operations (commits, checkouts, merges, rebases).
      Focus on extracting the repository/project as a `software` entity and
      any technologies or frameworks mentioned in commit messages.

      Entity extraction rules:
      - Extract the repository name as a `software` entity.
      - Extract programming languages and frameworks as `technology` entities
        only when clearly visible in commit context.
      - COMMITTED: for commit operations.
      - WORKS_WITH: for technologies used in the project.
      - USES: for tools and platforms (GitHub, GitLab).
      - Do NOT extract individual file paths, function names, or branch names
        as entities.

  timeline.terminal_history:
    allowed_entity_types:
      - software
      - technology
    allowed_predicates:
      - EXECUTED
      - USED
      - USES
    structured_allowed_entity_types:
      - software
      - technology
    structured_allowed_predicates:
      - EXECUTED
      - USED
      - USES
    allow_graph: true
    allow_assertion: false
    extraction_instructions: |
      These events are shell command executions. Extract meaningful tool usage
      patterns, not individual commands.

      Entity extraction rules:
      - Extract CLI tools and package managers as `software` entities
        (e.g., docker, kubectl, npm, brew).
      - Extract programming runtimes as `technology` entities
        (e.g., python, node, rust).
      - USES: for recurring tool usage patterns.
      - EXECUTED: for specific tool invocations.
      - Do NOT extract arguments, file paths, environment variables,
        or shell builtins (cd, ls, cat) as entities.
      - Be SELECTIVE: skip noise commands and focus on tools that reveal
        the user's technical stack and workflow.

  timeline.screen_time:
    allowed_entity_types:
      - software
      - media
    allowed_predicates:
      - USES
      - VIEWED
    structured_allowed_entity_types:
      - software
      - media
    structured_allowed_predicates:
      - USES
      - VIEWED
    allow_graph: true
    allow_assertion: false
    extraction_instructions: |
      These events are app usage duration records from macOS Screen Time.
      Each event reports how long an app was used in a time window.

      Entity extraction rules:
      - Extract the application as a `software` entity.
      - Extract media apps (Netflix, YouTube, etc.) with VIEWED predicate.
      - USES: for productivity and development tools.
      - Only extract apps with meaningful usage duration, skip brief
        system utility interactions.
      - Normalize app names: use the canonical app name, not the bundle
        identifier.
