name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify release commit CI
    outputs:
      run_id: ${{ steps.verify.outputs.run_id }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require successful CI for release commit
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_ids="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml --branch main \
              --commit "${GITHUB_SHA}" \
              --status success \
              --limit 20 \
              --json databaseId,headSha,event \
              --jq '.[] | select(.headSha == env.GITHUB_SHA and (.event == "push" or .event == "workflow_dispatch" or .event == "schedule")) | .databaseId'
          )"
          for run_id in ${run_ids}; do
            full="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json jobs \
              --jq '[.jobs[] | select(.name == "Full validation" and .conclusion == "success")] | length')"
            if [[ "$full" != 1 ]]; then continue; fi
            availability="$(scripts/release-candidates.sh "$run_id")"
            if [[ "$availability" == ready ]]; then
              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "Release commit ${GITHUB_SHA} passed full CI in run ${run_id}."
              exit 0
            fi
          done
          echo "No successful full ci.yml run found for release commit ${GITHUB_SHA}." >&2
          exit 1

  publish-tauri:
    name: Finalize desktop candidate (${{ matrix.label }})
    needs: verify-ci
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      actions: read
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            os_family: macos
            bundles: app,dmg
          - label: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_family: windows
            bundles: nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use canonical npm
        run: npm install -g npm@11.16.0

      - name: Set up release verification Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"

      - name: Validate version metadata against release tag
        shell: bash
        run: |
          python scripts/release-version.py validate --tag "${GITHUB_REF_NAME}"

      - name: Restore the checked candidate from full CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.verify-ci.outputs.run_id }}" --name "desktop-${{ matrix.target }}" --dir candidate
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p "$bundle"
          tar -xf candidate/desktop-candidate.tar -C "$bundle"

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Build release notes from commits
        id: release_notes
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-v:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"
          max_release_note_commits=200

          if [ -n "${previous_tag}" ]; then
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
            heading="## Changes since ${previous_tag}"
            commit_range="${previous_tag}..${current_tag}"
          else
            compare_url=""
            heading="## Initial release"
            commit_range="${current_tag}"
          fi

          commit_count="$(git rev-list --no-merges --count "${commit_range}")"
          commit_lines="$(git log --no-merges --max-count="${max_release_note_commits}" --pretty='- %s (%h)' "${commit_range}")"

          if [ -z "${commit_lines}" ]; then
            commit_lines="- No user-facing commits found in this release."
          elif [ "${commit_count}" -gt "${max_release_note_commits}" ]; then
            omitted_count=$((commit_count - max_release_note_commits))
            commit_lines="${commit_lines}"$'\n\n'"_Showing latest ${max_release_note_commits} commits; ${omitted_count} older commits omitted from these notes._"
          fi

          {
            echo "title=Magi ${current_tag}"
            echo "body<<EOF"
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | \`Magi_${current_tag#v}_aarch64.dmg\` |"
            echo "| Windows | \`Magi_${current_tag#v}_x64-setup.exe\` |"
            echo
            echo "macOS desktop and standalone service packages require Apple Silicon and macOS 15 or later. Intel Mac packages are no longer produced."
            echo
            echo "> Other assets (\`.app.tar.gz\`, \`.sig\`, \`.json\`) are for the built-in auto-updater. No manual download needed."
            echo
            echo "${heading}"
            echo
            echo "${commit_lines}"
            if [ -n "${compare_url}" ]; then
              echo
              echo "**Full Changelog**: ${compare_url}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Finalize and upload checked desktop candidate
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGI_BUILD_TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os_family == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os_family == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os_family == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os_family == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_CERTIFICATE: ${{ matrix.os_family == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os_family == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: bash ../scripts/finalize-desktop-release.sh
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.release_notes.outputs.title }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package standalone Mac service candidate
        if: matrix.os_family == 'macos'
        shell: bash
        env:
          MAGI_REQUIRE_SERVICE_NOTARIZATION: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/package-service-macos.mjs \
            --target "${{ matrix.target }}" \
            --source "${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/bundle/macos/Magi.app/Contents/Resources/server-dist" \
            --signed-source

      - name: Upload standalone Mac service candidate
        if: matrix.os_family == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/packages/MagiServer_*_${{ matrix.target }}.dmg \
            build/packages/MagiServer_*_${{ matrix.target }}.dmg.sha256 \
            build/packages/MagiServer_*_${{ matrix.target }}.dmg.json \
            --clobber

  publish-release:
    name: Verify assets and publish release
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check installers, signatures and updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/assets.json"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP" --pattern latest.json --pattern '*.sig'
          python3 scripts/check-release-assets.py "$RUNNER_TEMP" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --verify-tag --draft=false
