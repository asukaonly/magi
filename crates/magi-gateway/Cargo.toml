[package]
name = "magi-gateway"
version = "0.1.0"
description = "Magi gateway: Axum HTTP/WS routes, IPC client, DB reader"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"
tokio = { version = "1", features = ["full"] }
