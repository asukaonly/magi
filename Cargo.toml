[workspace]
resolver = "2"
exclude = ["vendor/glib"]
members = [
    "crates/magi-service-contract",
    "crates/magi-platform",
    "crates/magi-server-runtime",
    "crates/magi-gateway",
    "frontend/src-tauri",
    "server",
]

[patch.crates-io]
# Backport the upstream VariantStrIter safety fix for the GTK3 dependency chain.
glib = { path = "vendor/glib" }
